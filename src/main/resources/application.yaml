spring:
  application:
    name: payflow
  datasource:
    url : ${DB_URL:jdbc:postgresql://localhost:5432/postgres }
#    jdbc:postgresql://localhost:5432/payflowdb
    username : ${DB_USER:}
    password : ${DB_PASS:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect